<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MUD RACING — квадроспорт с водными препятствиями</title>
<style>
  :root{
    --orange:#ff7a1f; --orange2:#ffa14d; --ink:#0b0c0f; --panel:#12141a;
    --line:rgba(255,255,255,.12); --txt:#eceef2; --dim:#9aa1ad; --green:#7dffa8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0b0e;
    font-family:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt);
    user-select:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    padding:16px;background:radial-gradient(120% 90% at 50% 0%,rgba(10,11,14,.72),rgba(6,7,9,.93));
    backdrop-filter:blur(7px);z-index:10;overflow:auto}
  #overlay.on{display:flex}
  #overlay{align-items:flex-start}
  .panel{width:min(760px,100%);margin:auto;background:linear-gradient(180deg,rgba(24,26,33,.96),rgba(14,16,21,.98));
    border:1px solid var(--line);border-radius:18px;padding:26px 26px 22px;
    box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
    animation:pop .28s cubic-bezier(.2,1.3,.4,1) both;max-height:96vh;overflow:auto}
  @keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  h1.logo{margin:2px 0 4px;font-family:"Arial Black",Impact,sans-serif;font-size:clamp(34px,7vw,58px);
    letter-spacing:-1px;line-height:.94;font-style:italic;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35)}
  h1.logo span{color:var(--orange);-webkit-text-stroke:0}
  h2{margin:0 0 6px;font-size:clamp(20px,3.4vw,28px);font-weight:800;letter-spacing:-.3px}
  .sub{color:var(--dim);font-size:14px;line-height:1.45;margin-bottom:16px}
  .sub.small{font-size:12.5px;margin-top:10px}
  .sub b{color:#fff}
  .kicker{font-size:12px;letter-spacing:2.4px;text-transform:uppercase;color:var(--orange);
    font-weight:800;margin-bottom:14px}
  .rules{display:grid;gap:8px;margin:6px 0 18px}
  .rule{font-size:13.5px;line-height:1.5;color:#c6cbd4;background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);border-left:3px solid var(--orange);
    border-radius:10px;padding:9px 12px}
  .rule b{color:#fff}
  .opts{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px}
  .opt{display:flex;flex-direction:column;gap:7px;font-size:12px;letter-spacing:1.2px;
    text-transform:uppercase;color:var(--dim);font-weight:700}
  .seg{display:flex;background:#0c0e12;border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
  .seg button{background:none;border:0;color:#aeb4bf;font:inherit;font-size:13px;letter-spacing:0;
    text-transform:none;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;transition:.16s}
  .seg button i{font-style:normal;color:#6d7481;font-weight:500;font-size:11px}
  .seg button.on{background:linear-gradient(180deg,#2c303a,#1c2027);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
  .seg button:hover{color:#fff}
  .btn{display:block;width:100%;border:0;border-radius:13px;padding:16px;font-size:16px;font-weight:900;
    letter-spacing:1.6px;cursor:pointer;transition:transform .12s,box-shadow .12s,filter .12s;
    font-family:inherit;background:#22262e;color:#dfe3ea}
  .btn.primary{background:linear-gradient(180deg,var(--orange2),var(--orange) 45%,#e35f0c);
    color:#1a0d02;box-shadow:0 8px 24px rgba(255,122,31,.32),inset 0 1px 0 rgba(255,255,255,.4)}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
  .btn:active{transform:translateY(1px) scale(.995)}
  .keys{margin-top:14px;font-size:12px;color:#767d8a;text-align:center;line-height:1.7}
  kbd{background:#1b1e25;border:1px solid #2c313b;border-bottom-width:2px;border-radius:5px;
    padding:1px 6px;font:inherit;font-size:11px;color:#c9cfd9}
  .grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
  @media(max-width:640px){.grid4{grid-template-columns:1fr}}
  .series{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:11px;padding:10px 12px}
  .stitle{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--orange);font-weight:800;margin-bottom:7px}
  .pair{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 0;border-top:1px dashed rgba(255,255,255,.06)}
  .pair:first-of-type{border-top:0}
  .pair em{color:#5c636f;font-style:normal;font-size:11px}
  .pair i{font-style:normal;color:#6c7482;font-size:10px;margin-left:-4px}
  .who{color:#c9cfd9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who.me{color:var(--orange);font-weight:800}
  .free{color:#6d7481;font-style:italic}
  .lane-row,.res-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);margin-bottom:7px;font-size:14px}
  .lane-row.me{border-color:rgba(255,122,31,.5);background:rgba(255,122,31,.09)}
  .lane-row .ln{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#7b8391;min-width:74px}
  .lane-row b{font-weight:800}
  .res-row b{flex:1;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res-row .ln{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#7b8391;min-width:74px}
  .res-row.me{border-color:rgba(255,122,31,.5);background:rgba(255,122,31,.09)}
  .res-row.win{box-shadow:0 0 0 1px rgba(125,255,168,.35) inset}
  .rt{font-variant-numeric:tabular-nums;color:#d4d9e2;font-weight:700;font-size:13px}
  .pen{font-style:normal;color:#ff7a5a;font-size:11px;margin-left:4px}
  .tot{font-variant-numeric:tabular-nums;font-weight:900;font-size:17px;min-width:66px;text-align:right}
  .diff{font-size:11.5px;color:#7d8592;min-width:52px;text-align:right}
  .lap{font-size:11px;color:#6d7481;min-width:84px;text-align:right}
  .pl{width:22px;font-weight:900;color:#8b94a2;font-size:13px}
  .table{margin:6px 0 18px}
  .table.final .res-row:nth-child(1){background:linear-gradient(90deg,rgba(125,255,168,.16),rgba(125,255,168,.02))}
  #gasped{position:fixed;right:18px;bottom:18px;width:104px;height:104px;border-radius:50%;display:none;
    align-items:center;justify-content:center;font-weight:900;letter-spacing:2px;font-size:15px;color:#1a0d02;
    background:radial-gradient(circle at 35% 30%,#ffb268,#ff7a1f 60%,#d9540c);
    box-shadow:0 10px 30px rgba(255,122,31,.35),inset 0 2px 0 rgba(255,255,255,.45);z-index:5;touch-action:none}
  #gasped:active{transform:scale(.96)}
  #snd{position:fixed;right:14px;top:14px;z-index:6;width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.16);
    background:rgba(12,12,15,.72);color:#fff;font-size:16px;cursor:pointer;display:none}
  #snd.on{display:block}
  #snd.muted{opacity:.4;text-decoration:line-through}
  body.touch #gasped.on.show{display:flex}
  @media(max-width:520px){
    .panel{padding:18px 16px 16px;border-radius:14px}
    .res-row,.lane-row{padding:9px 10px;font-size:13px;gap:7px}
    .res-row .ln,.lane-row .ln{min-width:56px;font-size:9.5px;letter-spacing:.6px}
    .res-row .lap{display:none}
    .tot{font-size:15px;min-width:56px}
    .diff{min-width:40px;font-size:10.5px}
    .rt{font-size:12px}
    .rule{font-size:12.5px}
    .btn{padding:14px;font-size:15px}
    .pair{font-size:12px}
    .grid4{gap:8px}
    #gasped{width:88px;height:88px;font-size:13px;right:12px;bottom:12px}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"></div>
<div id="gasped" class="on">ГАЗ</div>
<button id="snd" title="Звук">♪</button>
<script>
/* ===== src/core.js ===== */
'use strict';
/* ===== MUD RACING — ядро: трасса, физика, ИИ, жеребьёвка (без DOM) ===== */
const MR = (function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const C = {
    DT: 1 / 120,
    WATER: -0.22,   // уровень воды относительно песка, м
    FLOAT: 1.0,     // глубина, с которой квадроцикл всплывает, м
    STEP: 0.1,
    X0: -30,
    START: -1.3,    // положение центра квадроцикла на старте (линия старта x=0)
    PENALTY: 2.0,   // штраф за фальстарт, с
    IDLE: 0.12,
    WB: 1.45,       // колёсная база
    WR: 0.44,       // радиус колеса
    TLIMIT: 90
  };

  /* ---------- Трасса ---------- */
  function makeTrack(seed) {
    const rnd = rng(seed), R = (a, b) => a + (b - a) * rnd();
    const baths = [], gaps = [];
    let x = 5.5;
    for (let i = 0; i < 3; i++) {
      const L = Math.round(R(30, 36));
      baths.push({ x0: x, x1: x + L });
      x += L;
      if (i < 2) {
        const g = Math.round(R(3, 5) * 2) / 2;
        gaps.push({ x0: x, x1: x + g });
        x += g;
      }
    }
    const finish = x + 7;
    const end = finish + 45;
    const n = Math.ceil((end - C.X0) / C.STEP) + 1;
    const lanes = [];
    for (let l = 0; l < 2; l++) {
      const feats = [];
      baths.forEach((b) => {
        const f = { b, base: R(0.62, 0.82), g: [] };
        const np = rnd() < 0.55 ? 2 : 1;
        const used = [];
        for (let k = 0; k < np; k++) {
          let c, tries = 0;
          do { c = R(b.x0 + 7, b.x1 - 8); tries++; } while (used.some((u) => Math.abs(u - c) < 7) && tries < 30);
          used.push(c);
          f.g.push({ c, s: R(1.6, 2.8), a: R(0.5, 0.75) });      // яма
        }
        let c, tries = 0;
        do { c = R(b.x0 + 6, b.x1 - 7); tries++; } while (used.some((u) => Math.abs(u - c) < 6) && tries < 30);
        f.g.push({ c, s: R(1.8, 3.0), a: -R(0.3, 0.42) });        // отмель
        feats.push(f);
      });
      const h = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const xx = C.X0 + i * C.STEP;
        let y = 0;
        for (const f of feats) {
          const b = f.b;
          if (xx > b.x0 && xx < b.x1) {
            let dpt = f.base;
            for (const g of f.g) dpt += g.a * Math.exp(-((xx - g.c) ** 2) / (2 * g.s * g.s));
            dpt = Math.max(0.3, dpt);
            const env = Math.min(smooth((xx - b.x0) / 2.4), smooth((b.x1 - xx) / 3.2));
            y = -dpt * env;
          }
        }
        for (const g of gaps) {
          const c = (g.x0 + g.x1) / 2, s = (g.x1 - g.x0) / 3.2;
          y += 0.3 * Math.exp(-((xx - c) ** 2) / (2 * s * s));
        }
        y += 0.16 * Math.exp(-((xx - (baths[0].x0 - 1.1)) ** 2) / (2 * 0.8 * 0.8));
        h[i] = y;
      }
      lanes.push({ h, n });
    }
    return { seed, baths, gaps, finish, end, lanes };
  }

  function hAt(lane, x) {
    const f = (x - C.X0) / C.STEP;
    const i = Math.floor(f);
    if (i < 0) return lane.h[0];
    if (i >= lane.n - 1) return lane.h[lane.n - 1];
    const t = f - i;
    return lane.h[i] * (1 - t) + lane.h[i + 1] * t;
  }
  function bathAt(track, x) {
    for (let i = 0; i < 3; i++) { const b = track.baths[i]; if (x >= b.x0 && x <= b.x1) return i; }
    return -1;
  }
  function depthAt(track, l, x) {
    if (bathAt(track, x) < 0) return 0;
    return Math.max(0, C.WATER - hAt(track.lanes[l], x));
  }
  function groundAt(track, l, x) {
    const h = hAt(track.lanes[l], x);
    if (bathAt(track, x) < 0) return h;
    return Math.max(h, C.WATER - C.FLOAT);
  }
  function nextBathDist(track, x) {
    for (let i = 0; i < 3; i++) { const b = track.baths[i]; if (b.x0 >= x) return b.x0 - x; }
    return 1e9;
  }
  function zone(d) {
    if (d <= 0.02) return [0.55, 1.0];
    return [lerp(0.52, 0.36, d), lerp(0.88, 0.60, d)];
  }

  /* ---------- Гонщик / физика ---------- */
  function newRider() {
    return {
      x: C.START, v: 0, y: 0, vy: 0, fly: false, air: false,
      rpm: C.IDLE, heat: 0, dig: 0, cut: 0, go: false, fin: false, time: 0,
      lo: 0.55, hi: 1, d: 0, depth: 0, spin: false, float: false,
      wheel: 0, pitch: 0, entered: [false, false, false], ev: [],
      top: 0, react: null, clean: 0, floods: 0, heats: 0, gas: false
    };
  }

  function stepRider(r, track, l, gas, dt, t) {
    if (r.cut > 0) { r.cut -= dt; gas = false; }
    if (r.fin) gas = false;
    r.gas = gas;
    const depth = depthAt(track, l, r.x);
    const d = clamp(depth / C.FLOAT, 0, 1);
    r.d = d; r.depth = depth; r.float = depth > C.FLOAT;
    const z = zone(d), lo = z[0], hi = z[1];
    r.lo = lo; r.hi = hi;

    if (gas) r.rpm += (r.air ? 1.5 : 0.9) * dt; else r.rpm -= 0.8 * dt;
    r.rpm = clamp(r.rpm, C.IDLE, 1);

    if (!r.go) { r.v = 0; r.spin = false; return; }

    const over = Math.max(0, r.rpm - hi);
    let eff;
    if (r.rpm < lo) eff = 0.88 * clamp((r.rpm - C.IDLE) / (lo - C.IDLE), 0, 1);
    else if (r.rpm <= hi) eff = 0.88 + 0.12 * (r.rpm - lo) / (hi - lo);
    else eff = Math.max(0.3, 1 - over * 4.5);

    const inWater = d > 0.02;
    if (!r.air) {
      r.spin = over > 0;
      if (over > 0) {
        if (inWater) r.dig = Math.min(1, r.dig + over * 3.5 * dt);
        r.heat += (0.10 + over * 2.5) * dt;
      } else {
        r.dig = Math.max(0, r.dig - 0.9 * dt);
        r.heat = Math.max(0, r.heat - 0.11 * dt);
      }
      if (r.heat >= 1 && r.cut <= 0 && !r.fin) {
        r.cut = 1.6; r.heat = 0.6; r.heats++;
        r.ev.push({ t: 'overheat' });
      }
      const gF = groundAt(track, l, r.x + 0.6), gR = groundAt(track, l, r.x - 0.6);
      const slope = (gF - gR) / 1.2;
      let vmax = inWater ? lerp(10.5, 4.6, Math.pow(d, 0.8)) : 15;
      if (slope > 0) vmax *= 1 - 0.45 * Math.min(1, slope / 0.5);
      const vt = vmax * eff * (1 - 0.45 * r.dig);
      let a;
      if (vt > r.v) a = Math.min((vt - r.v) * (inWater ? 1.8 : 1.2), inWater ? 5.5 : 7.5);
      else a = (vt - r.v) * (inWater ? 1.0 + 1.8 * d : 0.45);
      if (!r.float) a -= 9.8 * slope / Math.hypot(1, slope) * 0.55;
      if (r.fin) a -= 7;
      r.v += a * dt;
      if (gas && r.rpm > 0.3 && r.v < 0.9) r.v = 0.9;
    } else {
      r.spin = false;
    }
    if (r.v < 0) r.v = 0;
    if (r.v > r.top) r.top = r.v;

    /* продольное и вертикальное движение */
    r.x += r.v * dt;
    const g2 = groundAt(track, l, r.x);
    if (r.fly) {
      r.vy -= 9.8 * dt;
      r.y += r.vy * dt;
      if (r.y <= g2) {
        const impact = -r.vy;
        r.y = g2; r.fly = false; r.vy = 0;
        if (impact > 1.6) r.ev.push({ t: 'land', p: impact });
      }
    } else {
      const nvy = (g2 - r.y) / dt;
      if (nvy < r.vy - 9.8 * dt * 1.6 && r.v > 2.5) {
        r.fly = true;
        r.vy = Math.min(r.vy, 6) - 9.8 * dt;
        r.y += r.vy * dt;
        if (r.y < g2) { r.y = g2; r.fly = false; r.vy = nvy; }
      } else { r.y = g2; r.vy = clamp(nvy, -12, 12); }
    }
    r.air = r.fly && (r.y - g2 > 0.05);

    /* вход в воду */
    const bi = bathAt(track, r.x);
    if (bi >= 0 && !r.entered[bi] && !r.air) {
      const dep = depthAt(track, l, r.x);
      if (dep > 0.1) {
        r.entered[bi] = true;
        const zz = zone(clamp(dep / C.FLOAT, 0, 1));
        let kind;
        if (r.rpm > zz[1] + 0.02) { kind = 'flood'; r.v *= 0.74; r.heat = Math.min(0.97, r.heat + 0.12); r.floods++; }
        else if (r.rpm >= zz[0] - 0.06) { kind = 'clean'; r.v *= 0.94; r.clean++; }
        else { kind = 'soft'; r.v *= 0.87; }
        r.ev.push({ t: 'entry', kind, p: r.v });
      }
    }

    /* наклон корпуса и вращение колёс */
    let pt;
    if (r.air) pt = clamp(r.vy * 0.05, -0.3, 0.22);
    else pt = Math.atan2(groundAt(track, l, r.x + C.WB / 2) - groundAt(track, l, r.x - C.WB / 2), C.WB);
    r.pitch += (pt - r.pitch) * Math.min(1, dt * 12);
    r.wheel += ((r.spin || r.air ? Math.max(r.v, r.rpm * 22) : r.v) / C.WR) * dt;

    if (!r.fin && r.x >= track.finish) {
      r.fin = true;
      r.time = t - (r.x - track.finish) / Math.max(r.v, 0.5);
    }
  }

  /* ---------- ИИ ---------- */
  function makeAIRun(skill, rnd) {
    const form = (rnd() - 0.5) * 0.12;             // «форма» в конкретном заезде
    const s = clamp(skill + form, 0.05, 1);
    return {
      skill: s,
      react: 0.17 + rnd() * 0.42 * (1.25 - s),
      aim: 0.42 + 0.42 * s,
      amp: 0.17 - 0.13 * s,
      n: 0, nT: 0, nt: 0,
      fs: rnd() < 0.05 * (1 - s),
      careful: rnd() < 0.35 + 0.6 * s
    };
  }
  function aiGas(ai, r, track, t, dt, rnd) {
    if (t < (ai.fs ? 0 : ai.react)) return false;
    ai.nt -= dt;
    if (ai.nt <= 0) { ai.nt = 0.25 + rnd() * 0.5; ai.nT = (rnd() * 2 - 1) * ai.amp; }
    ai.n += (ai.nT - ai.n) * Math.min(1, dt * 6);
    let target = r.lo + (r.hi - r.lo) * ai.aim + ai.n;
    if (r.d <= 0.02 && ai.careful) {
      const dist = nextBathDist(track, r.x);
      if (dist < Math.max(2.2, r.v * 0.32)) target = Math.min(target, 0.8 + ai.n * 0.5);
    }
    if (r.air) target = Math.min(target, ai.careful ? 0.7 : 0.95);
    return r.rpm < target;
  }
  function simRun(track, l, skill, rnd) {
    const ai = makeAIRun(skill, rnd);
    const r = newRider();
    let t = 0;
    while (!r.fin && t < C.TLIMIT) {
      t += C.DT;
      const gas = aiGas(ai, r, track, t, C.DT, rnd);
      if (gas && !r.go) { r.go = true; r.react = t; }
      stepRider(r, track, l, gas, C.DT, t);
      r.ev.length = 0;
    }
    const raw = r.fin ? r.time : C.TLIMIT;
    const pen = ai.fs ? C.PENALTY : 0;
    return { raw, pen, total: raw + pen, react: ai.fs ? 0 : r.react, top: r.top };
  }

  /* ---------- Жеребьёвка ---------- */
  function shuffle(a, rnd) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }

    }
    if (S.split !== null && S.split !== undefined) {
      const abs = Math.abs(S.split), ahead = S.split < 0;
      text((ahead ? '▲ ' : '▼ ') + abs.toFixed(1) + ' м', W - 16 * U, 66 * U, 16 * U, ahead ? '#7dffa8' : '#ff9a7a', 'right', 'rgba(0,0,0,.75)', true);
    }
    // мини-карта
    const mw = Math.min(W * 0.62, 560 * U), mx = W / 2 - mw / 2, my = 10 * U + th + (S.pen ? 26 : 10) * U, mh = 9 * U;
    const fx = (x) => mx + clamp(x / S.track.finish, 0, 1) * mw;
    ctx.fillStyle = 'rgba(12,12,15,.8)'; rrect(mx - 5, my - 5, mw + 10, mh + 10, 6); ctx.fill();
    ctx.fillStyle = '#d9cba3'; ctx.fillRect(mx, my, mw, mh);
    ctx.fillStyle = '#6d8590';
    for (const b of S.track.baths) ctx.fillRect(fx(b.x0), my, fx(b.x1) - fx(b.x0), mh);
    for (let l = 0; l < 2; l++) {
      const e = S.lanes[l]; if (!e) continue;
      const X = fx(e.r.x), Y = my + mh / 2;
      circ(X, Y, (e.player ? 8 : 6) * U, e.player ? '#fff' : '#111');
      circ(X, Y, (e.player ? 5.5 : 4.5) * U, e.look.accent);
    }

    if (pr) {
      const R = 58 * U;
      drawGauge(pr, 20 * U + R * 1.16, H - 18 * U - R * 1.16, R);
      const inWater = pr.d > 0.02;
      text(inWater ? 'ВОДА · глубина ' + pr.depth.toFixed(1) + ' м' : 'ПЕСОК · газ в пол!', 20 * U, H - 30 * U - R * 2.5, 13 * U, inWater ? '#9fe0ff' : '#ffe08a', 'left', 'rgba(0,0,0,.75)');
    }
    // светофор
    if (S.lights > 0 && S.lightA > 0) {
      ctx.globalAlpha = S.lightA;
      const lr = 26 * U, bw2 = lr * 8.2, bh2 = lr * 3, bx2 = W / 2 - bw2 / 2, by2 = H * 0.2;
      ctx.fillStyle = '#101013'; rrect(bx2, by2, bw2, bh2, lr * 0.7); ctx.fill();
      ctx.strokeStyle = '#34343b'; ctx.lineWidth = 3; ctx.stroke();
      const cols = [['#ff3b2f', '#3d1411'], ['#ffc928', '#3d300e'], ['#3be35a', '#0f3317']];
      for (let i = 0; i < 3; i++) {
        const on = (i === 0 && (S.lights === 1 || S.lights === 2)) || (i === 1 && S.lights === 2) || (i === 2 && S.lights === 3);
        if (on) { ctx.shadowColor = cols[i][0]; ctx.shadowBlur = 30 * U; }
        circ(W / 2 + (i - 1) * lr * 2.6, by2 + bh2 / 2, lr, on ? cols[i][0] : cols[i][1]);
        ctx.shadowBlur = 0;
      }
      const cap = S.lights === 1 ? 'НА СТАРТ' : S.lights === 2 ? 'ВНИМАНИЕ' : 'МАРШ!';
      text(cap, W / 2, by2 + bh2 + 22 * U, 22 * U, '#fff', 'center', 'rgba(0,0,0,.8)', true);
      ctx.globalAlpha = 1;
    }
    if (S.hint) text(S.hint, W / 2, H - 22 * U, 14 * U, '#fff', 'center', 'rgba(0,0,0,.75)');
  }
  function drawOverlayFx(S) {
    for (const s of S.splats) {
      ctx.globalAlpha = clamp(s.a, 0, 1) * 0.9; ctx.fillStyle = s.c;
      ctx.beginPath();
      for (let i = 0; i <= 10; i++) {
        const an = (i / 10) * 6.2832, rr = s.r * U * (0.75 + 0.35 * hash(s.seed + (i % 10)));
        const px = s.x * W + Math.cos(an) * rr, py = s.y * H + Math.sin(an) * rr * (1 + s.drip * (Math.sin(an) > 0.5 ? 1 : 0));
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);

    ctx.globalAlpha = 1;
    let row = 0;

      text(m.text, W / 2, H * 0.36 - row * 40 * U - p * 26 * U, (m.big ? 40 : 28) * U * sc, m.col, 'center', 'rgba(0,0,0,.82)', true);
      row++;
    }
    ctx.globalAlpha = 1;
  }

  function render(S) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (view.shake > 0.01) ctx.translate((Math.random() - 0.5) * view.shake * 14 * U, (Math.random() - 0.5) * view.shake * 14 * U);
    const track = S.track, rs = [S.lanes[0] ? S.lanes[0].r : null, S.lanes[1] ? S.lanes[1].r : null];
    drawSky();
    const fb = yFar - 1.2 * ppm;
    drawForest(0.1, fb, 0.85, ['#3f7357', '#4a7d5e', '#356249'], 3);
    ctx.fillStyle = '#3a6b4d'; ctx.fillRect(0, fb - 1.3 * ppm, W, 1.4 * ppm);
    drawForest(0.3, fb + 0.2 * ppm, 0.8, ['#2c5c3c', '#3a6d45', '#487d50', '#315f41'], 11);
    drawBank();
    const sb = yFar - 0.34 * ppm;
    drawArch(-9.5, -2.2, 'СТАРТ', sb);
    drawArch(track.finish + 1.2, track.finish + 8.5, 'ФИНИШ', sb);
    drawFlags(sb, track);
    drawCrowd(sb, rs);
    drawLightPole(1.0, sb, S.lights);
    drawFinishFlag(track.finish, yFar);
    drawLane(0, yFar, S);
    drawFinishFlag(track.finish, yNear);
    drawLane(1, yNear, S);
    // лента на переднем плане
    const fy = Math.max(yNear + 2.2 * ppm, H - 26 * U);
    if (fy < H + 10) {
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 13 * U; ctx.strokeStyle = '#f4f1ea'; ctx.beginPath(); ctx.moveTo(-10, fy + 8 * U); ctx.lineTo(W + 10, fy - 6 * U); ctx.stroke();
      ctx.setLineDash([34 * U, 34 * U]); ctx.lineDashOffset = view.cam * ppm * 1.5; ctx.strokeStyle = '#d93a2e';
      ctx.beginPath(); ctx.moveTo(-10, fy + 8 * U); ctx.lineTo(W + 10, fy - 6 * U); ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset = 0;
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    const vg = vigGrad || (vigGrad = ctx.createRadialGradient(W * 0.5, H * 0.52, Math.min(W, H) * 0.42, W * 0.5, H * 0.52, Math.max(W, H) * 0.78));
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.42)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    if (S.hud) drawHUD(S);
    drawOverlayFx(S);
  }

  function debugQuad(canvas, look, opts) {
    init(canvas);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = (opts && opts.bg) || '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ppm = (opts && opts.ppm) || 120; W = canvas.width; H = canvas.height;

    drawQuad(r, H * 0.75, look);
  }
  return { init, resize, render, view, debugQuad, get W() { return W; }, get H() { return H; }, get ppm() { return ppm; } };
})();

  const fmt = (t) => (t === null || t === undefined || !isFinite(t) ? '—' : t.toFixed(2));

  /* ---------- жеребьёвка ---------- */
  function newChampionship() {
    G.seed = (Date.now() % 100000) + 7;
    G.rnd = MR.rng(G.seed);
    G.track = MR.makeTrack(1 + Math.floor(G.rnd() * 5));

    const looks = MR.shuffle(LOOKS.slice(), G.rnd);
    const d = DIFF[G.diff], used = [];
    G.riders.push({ name: 'ВЫ', isPlayer: true, look: LOOKS[0], skill: 0, runs: [], total: 0, num: 0 });
    for (let i = 1; i < G.nRiders; i++) {
      let lk, tries = 0;
      do { lk = looks[Math.floor(G.rnd() * looks.length)]; tries++; } while (used.includes(lk) && tries < 30);
      used.push(lk);
      G.riders.push({
        name: pool[(i - 1) % pool.length], isPlayer: false, look: lk,
        skill: d[0] + (d[1] - d[0]) * G.rnd(), runs: [], total: 0, num: i
      });
    }

      <div class="sub small">Ты едешь по одному заезду в каждой серии; остальные пары едут параллельно — их времена засчитываются автоматически.</div>

  /* ---------- серия: симулируем заезды без игрока, затем едем свой ---------- */
  function playSeries(s) {
    G.si = s;

    series.forEach((heat, i) => {
      if (i === G.playerHeat[s]) return;

  function startRace() {
    G.started = true; G.t = 0; G.lights = 3; SFX.light(3);

      RN.view.shake = 0.6;
    }
    G.screen = 'racing';
  }

  function handleEvents(e, l) {
    const r = e.r;
    for (const ev of r.ev) {
      if (ev.t === 'entry') {
        if (ev.kind === 'clean') {
          SFX.clean();
          if (e.player) msg('ЧИСТО!', '#7dffa8', false);
          burst(l, r, 16, 'light');
        } else if (ev.kind === 'flood') {
          SFX.flood();
          if (e.player) { msg('ПЕРЕЛИВ! −25% хода', '#ff7a5a', false); RN.view.shake = 0.45; }
          burst(l, r, 26, 'mud');
          if (e.player) splat();
        } else {
          if (e.player) { msg('малый газ — тонет', '#ffd23e', false); SFX.splash(r.v); }
          burst(l, r, 8, 'light');
        }
      } else if (ev.t === 'overheat') {
        if (e.player) { msg('ЗАГЛОХ! −1.6 с', '#ff5a4a', false); RN.view.shake = 0.55; splat(); SFX.overheat(); }
        burst(l, r, 10, 'dark');
      } else if (ev.t === 'land') {
        burst(l, r, 8, 'light');
      }
    }
    r.ev.length = 0;
  }
  function burst(l, r, n, kind) {
    for (let i = 0; i < n; i++) {
      const sp = kind === 'mud' ? 5.5 : kind === 'dark' ? 4 : 3.2;
      G.particles.push({
        l, x: r.x + (Math.random() - 0.4) * 0.5, y: 0.15 + Math.random() * 0.5,
        vx: -r.v * 0.35 - Math.random() * sp, vy: 1.5 + Math.random() * sp,
        life: 0.45 + Math.random() * 0.55, max: 1, s: 0.025 + Math.random() * 0.06,
        c: kind === 'light' ? 'rgba(238,236,226,.9)' : kind === 'dark' ? 'rgba(70,60,42,.95)' : 'rgba(112,96,62,.95)'
      });
    }
  }
  function splat() {
    G.splats.push({
      x: 0.15 + Math.random() * 0.7, y: 0.2 + Math.random() * 0.55, r: 70 + Math.random() * 110,
      a: 1, c: 'rgba(96,80,52,.92)', seed: Math.random() * 99, drip: 0.9
    });
    if (G.splats.length > 6) G.splats.shift();
  }

  function endHeat() {
    if (G.ended) return;
    G.ended = true;
    let best = null;
    const rows = [];
    const tots = [];
    for (let l = 0; l < 2; l++) {
      const e = G.lanes[l];
      if (!e) { rows.push({ none: true, lane: l }); continue; }
      const raw = e.r.fin ? e.r.time : C.TLIMIT;
      const pen = e.player ? G.pen : (e.ai.fs ? C.PENALTY : 0);
      const total = raw + pen;
      e.entry.runs.push({ raw, pen, total, lane: l });
      e.entry.total += total;
      tots.push(total);
      if (!best || total < best.total) best = { total, e };
      rows.push({ e, raw, pen, total, lane: l, react: e.r.react });
    }
    let html = `<div class="kicker">${G.label} — финиш</div>`;
    for (const row of rows) {
      if (row.none) { html += `<div class="res-row"><span class="ln">дорожка ${row.lane + 1}</span><b class="free">без пары</b></div>`; continue; }
      const w = best && Math.abs(row.total - best.total) < 1e-6;
      html += `<div class="res-row ${row.e.player ? 'me' : ''} ${w ? 'win' : ''}">
        <span class="ln">дорожка ${row.lane + 1}</span>
        <b>${row.e.name}</b>
        <span class="rt">${fmt(row.raw)}${row.pen ? `<i class="pen">+${row.pen.toFixed(2)}</i>` : ''}</span>
        <span class="tot">${fmt(row.total)}</span>
        <span class="diff">${best && row.total > best.total + 0.001 ? '+' + (row.total - best.total).toFixed(2) : 'лучший'}</span>
      </div>`;
    }
    const pr = G.playerLane >= 0 ? G.lanes[G.playerLane] : null;
    if (pr) {
      const react = (G.fs || pr.ai && pr.ai.fs) ? 'фальстарт' : (pr.r.react !== null && pr.r.react !== undefined ? pr.r.react.toFixed(2) + ' с' : '—');
      const clean = pr.r.clean;
      html += `<div class="sub small">Реакция: <b>${react}</b> · макс. <b>${(pr.r.top * 3.6).toFixed(0)} км/ч</b> · чистых входов в воду: <b>${clean}/3</b>${pr.r.heats ? ' · перегревов: <b>' + pr.r.heats + '</b>' : ''}</div>`;
    }
    const last = G.si === 3;
    html += `<button class="btn primary" id="btn-next">${last ? 'ИТОГИ ЧЕМПИОНАТА' : 'ИТОГИ СЕРИИ'}</button>`;
    show(html);
    G.screen = 'heatResult';
    document.getElementById('btn-next').addEventListener('click', () => {
      hide();
      if (G.si >= 3) { finalScreen(); return; }
      seriesScreen();
    });
  }

  function seriesScreen() {
    G.screen = 'seriesResult';
    const sorted = G.riders.slice().sort((a, b) => a.total - b.total);
    let rows = '';
    sorted.forEach((e, i) => {
      const done = e.runs.length;
      rows += `<div class="res-row ${e.isPlayer ? 'me' : ''}">
        <span class="pl">${i + 1}</span><b>${e.name}</b>
        <span class="tot">${done ? fmt(e.total) : '—'}</span>
        <span class="diff">${done}/${4}</span></div>`;
    });
    const soloNote = G.nRiders % 2 ? '<div class="sub small">Нечётное число участников: в каждой серии один гонщик едет без пары — так задумано.</div>' : '';
    show(`<h2>После серии ${G.si + 1}</h2><div class="sub">сумма времени по всем заездам · осталось серий: ${3 - G.si}</div>
      <div class="table">${rows}</div>${soloNote}
      <button class="btn primary" id="btn-s">СЕРИЯ ${G.si + 2} · ТВОЙ ЗАЕЗД</button>`);
    document.getElementById('btn-s').addEventListener('click', () => { hide(); playSeries(G.si + 1); });
  }

  function finalScreen() {
    G.screen = 'final';
    const sorted = G.riders.slice().sort((a, b) => a.total - b.total);
    const win = sorted[0];
    const me = G.riders[0], place = sorted.indexOf(me) + 1;
    let rows = '';
    sorted.forEach((e, i) => {
      const bestLap = Math.min(...e.runs.map((r) => r.total));
      rows += `<div class="res-row ${e.isPlayer ? 'me' : ''} ${i === 0 ? 'win' : ''}">
        <span class="pl">${i + 1}</span><b>${e.name}</b>
        <span class="tot">${fmt(e.total)}</span>
        <span class="diff">${i === 0 ? '🏆' : '+' + (e.total - win.total).toFixed(2)}</span>
        <span class="lap">лучший ${fmt(bestLap)}</span></div>`;
    });
    const title = place === 1 ? 'ПОБЕДА!' : place <= 3 ? 'ПОДИУМ' : 'НЕ ПРОШЁЛ';
    const col = place === 1 ? '#7dffa8' : place <= 3 ? '#ffd23e' : '#ff8a6a';
    show(`<div class="kicker" style="color:${col}">${title} · ${place} место</div>
      <h2>Итоги чемпионата</h2>
      <div class="sub">сумма четырёх заездов — это и есть результат</div>
      <div class="table final">${rows}</div>
      <button class="btn primary" id="btn-again">ЕЩЁ РАЗ</button>`);
    document.getElementById('btn-again').addEventListener('click', menu);
  }

  /* ---------- обновление ---------- */
  function update(dt) {
    if (G.screen === 'countdown') {
      G.pre += dt;
      const L = G.pre < 0.9 ? 1 : G.pre < 1.9 ? 2 : 3;
      if (L !== G.lights) { G.lights = L; SFX.light(L); }
      if (input.gas && !G.started && G.pre > 0.35) G.fs = true;
      if (G.pre >= 1.9) startRace();
      for (let l = 0; l < 2; l++) {
        const e = G.lanes[l]; if (!e) continue;
        MR.stepRider(e.r, G.track, l, input.gas && e.player ? true : false, dt, 0);
        e.r.ev.length = 0;
      }
    } else if (G.screen === 'racing') {
      G.t += dt;
      for (let l = 0; l < 2; l++) {
        const e = G.lanes[l]; if (!e) continue;
        const r = e.r;
        let gas;
        if (e.player) {
          gas = dbg.auto ? (r.rpm < r.lo + (r.hi - r.lo) * 0.9) : input.gas;
          if (gas && r.react === null && !r.fin) r.react = G.t;
        } else {
          gas = MR.aiGas(e.ai, r, G.track, G.t, dt, G.heatRnd);
        }
        MR.stepRider(r, G.track, l, gas, dt, G.t);
        handleEvents(e, l);
        if (e.player && r.fin && !e._saidFin) {
          e._saidFin = true;
          msg('ФИНИШ ' + r.time.toFixed(2), '#7dffa8', true);
          SFX.finish();
        }
        if (!r.air && r.depth > 0.05 && r.v > 3 && Math.random() < 0.7) {
          burst(l, r, 1, 'light');
        }
      }
      if (G.lightA > 0) G.lightA = Math.max(0, G.lightA - dt * 0.7);
      const allDone = G.lanes.every((e) => !e || e.r.fin || G.t > 60);
      if (allDone) endHeat();
    }
    // звук двигателя игрока
    const pLane = G.playerLane >= 0 ? G.lanes[G.playerLane] : null;
    if (pLane && (G.screen === 'racing' || G.screen === 'countdown')) {
      SFX.engine(pLane.r.rpm, pLane.r.gas, pLane.r.d > 0.02);
    } else SFX.engineOff();
    if (ov.classList.contains('on')) ped.classList.remove('show');
    else ped.classList.add('show');
    // камера
    if (G.playerLane >= 0 && G.lanes[G.playerLane]) {
      const px = G.lanes[G.playerLane].r.x;
      RN.view.cam += (px - RN.view.cam) * Math.min(1, dt * 7);
    }
    // частицы
    for (let i = G.particles.length - 1; i >= 0; i--) {
      const p = G.particles[i];
      p.life -= dt; if (p.life <= 0) { G.particles.splice(i, 1); continue; }
      p.vy -= 9.8 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.99;
      if (p.y < -0.1) p.life = 0;
    }
    const capP = RN.ppm < 55 ? 220 : 500;
    if (G.particles.length > capP) G.particles.splice(0, G.particles.length - capP);
    for (let i = G.splats.length - 1; i >= 0; i--) { G.splats[i].a -= dt * 0.55; if (G.splats[i].a <= 0) G.splats.splice(i, 1); }
    for (let i = G.msgs.length - 1; i >= 0; i--) { G.msgs[i].life -= dt; if (G.msgs[i].life <= 0) G.msgs.splice(i, 1); }
    RN.view.shake = Math.max(0, RN.view.shake - dt * 2.2);
  }

  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000; last = now;
    dt = Math.min(dt, 0.05);
    RN.view.dt = dt;
    update(dt);
    const pr = G.playerLane >= 0 && G.lanes[G.playerLane] ? G.lanes[G.playerLane].r : null;
    let hint = '';
    if (G.screen === 'racing' && pr && !pr.fin) {
      const nearWater = MR.nextBathDist(G.track, pr.x) < 9;
      if (pr.cut > 0) hint = 'ДВИГАТЕЛЬ ЗАГЛОХ — жди';
      else if (pr.d > 0.02) hint = 'Держи газ в зелёной зоне тахометра';
      else if (nearWater && pr.rpm > pr.hi - 0.05) hint = 'Перед водой сбрось обороты!';
      else if (nearWater) hint = 'Сейчас вода — газ в зелёную зону';
      else hint = 'По песку — газ в пол';
    }
    // текущее место по проекции итоговой суммы
    let place = 0, rivals = 0, split = null;
    if (pr && G.riders.length && (G.screen === 'racing' || G.screen === 'countdown')) {
      const proj = G.riders.map((e) => {
        const done = e.runs.length;
        const avg = done ? e.total / done : 20;
        let v = e.total + (4 - done) * avg;
        if (e.isPlayer && !pr.fin) v = e.total + Math.max(0, G.t);
        return v;
      });
      const mine = proj[0];
      place = proj.filter((v) => v < mine - 1e-6).length + 1;
      rivals = G.riders.length;
      const other = G.lanes[G.playerLane ^ 1];
      if (other) split = other.r.x - pr.x;
    }
    RN.render({
      track: G.track || MR.makeTrack(1), t: G.t, lanes: G.lanes, pl: G.playerLane,
      place, rivals, split,
      particles: G.particles, splats: G.splats, msgs: G.msgs,
      lights: G.lights, lightA: G.lightA, label: G.label, pen: G.pen,
      hud: G.screen === 'racing' || G.screen === 'countdown', tags: true, hint
    });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  menu();
})();

</script>
</body>
</html>
